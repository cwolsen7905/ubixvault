{{- if and (eq .Values.storage.type "raft") .Values.storage.networkPolicy.enabled -}}
# The cluster port (Raft and request forwarding, mutual TLS) is reachable only
# from the vault pods themselves. The API port is open to the listed sources,
# or to the namespace when none are given (add your ingress controller).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ubixvault.fullname" . }}
  labels:
    {{- include "ubixvault.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ubixvault.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.ha.clusterPort }}
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "ubixvault.selectorLabels" . | nindent 14 }}
    - ports:
        - port: {{ .Values.containerPort }}
          protocol: TCP
      {{- with .Values.storage.networkPolicy.apiFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      from:
        - podSelector: {}
      {{- end }}
{{- end }}
