# Default values for the ubixvault chart.
# uBix Vault is single-node (no HA yet) — replicaCount must stay 1.

replicaCount: 1

image:
  # No official image is published yet; point this at wherever you build/push
  # the Dockerfile at the repo root. The tag defaults to the chart's appVersion.
  repository: ghcr.io/cwolsen7905/ubixvault
  tag: ""            # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Port the container listens on (inside the pod).
containerPort: 8200

service:
  type: ClusterIP
  port: 8200
  annotations: {}

# --- Persistence -----------------------------------------------------------
# The encrypted data directory. This is the whole vault at rest — back it up.
persistence:
  enabled: true
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  # storageClass: ""       # "" = cluster default; "-" = disable dynamic provisioning
  # existingClaim: ""      # use a pre-created PVC instead of a volumeClaimTemplate
  mountPath: /var/lib/ubixvault

# --- Auto-unseal -----------------------------------------------------------
# Strongly recommended in Kubernetes: without it, every pod restart needs a
# human to feed Shamir unseal shares. The master key is wrapped by a 32-byte
# key-encryption key (KEK) supplied here as 64 hex chars.
autoUnseal:
  enabled: true
  # Provide the KEK one of two ways:
  #  1. existingSecret — reference a Secret you manage (recommended):
  existingSecret: ""       # name of a Secret containing the KEK
  secretKey: auto-unseal-key
  #  2. create — let the chart create a Secret from a value you pass in.
  #     Do NOT commit a real KEK to values; pass via --set-string or a sealed secret.
  create: false
  key: ""                  # 64 hex chars (32 bytes); only used when create=true

# --- TLS -------------------------------------------------------------------
# Serve HTTPS. Without TLS the server refuses to serve on a non-loopback address
# unless devNoTLS is set (INSECURE — trusted networks / testing only).
tls:
  enabled: true
  # Mount an existing Secret of type kubernetes.io/tls (keys: tls.crt, tls.key).
  existingSecret: ""
  mountPath: /etc/ubixvault/tls
  # Optionally have cert-manager issue the certificate into `existingSecret`.
  certManager:
    enabled: false
    secretName: ubixvault-tls    # cert-manager writes here; set tls.existingSecret to match
    dnsNames: []                 # e.g. [ubixvault.svc.cluster.local]
    duration: 2160h              # 90d
    renewBefore: 360h            # 15d
    issuerRef:
      name: ""
      kind: ClusterIssuer        # or Issuer
      group: cert-manager.io

# Allow plaintext HTTP on a non-loopback address. INSECURE — only for trusted
# networks or testing. Ignored when tls.enabled is true.
devNoTLS: false

# --- Audit logging ---------------------------------------------------------
# Audit is FAIL-CLOSED: if the sink is unavailable or full, the vault stops
# serving. Off by default so a filling disk cannot take the vault down
# unexpectedly. Enable with a DEDICATED volume in production-like use.
audit:
  enabled: false
  # Must live under audit.persistence.mountPath below — the server opens this
  # file without creating parent dirs, and audit is fail-closed, so a path
  # outside the mounted volume stops the vault from serving.
  path: /var/log/ubixvault/audit.log
  persistence:
    enabled: true
    size: 512Mi
    accessModes:
      - ReadWriteOnce
    # storageClass: ""
    mountPath: /var/log/ubixvault

# --- Kubernetes auth method ------------------------------------------------
# The vault validates pod ServiceAccount tokens via the TokenReview API, which
# requires the vault's own ServiceAccount to be bound to system:auth-delegator.
# Leave enabled if you plan to use the kubernetes auth method.
kubernetesAuth:
  enabled: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Extra server args / env appended verbatim.
extraArgs: []
extraEnv: []

# --- Scheduling & security -------------------------------------------------
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podSecurityContext:
  # distroless :nonroot runs as uid/gid 65532; fsGroup makes the PVC writable.
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# Probe tuning. Liveness is a TCP check (the process is up) — NOT an HTTP check,
# because a sealed vault returns 503 on /v1/sys/health and an httpGet liveness
# probe would crash-loop it forever. Readiness is httpGet on health: only a
# 200 (initialized AND unsealed) makes the pod ready to receive traffic.
probes:
  startup:
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
